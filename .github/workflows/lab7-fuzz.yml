
name: Lab 7 Hypothesis Fuzz Tests

on:
  push:
    paths:
      - "Lab 7/**"
      - ".github/workflows/lab7-fuzz.yml"
  workflow_dispatch:

jobs:
  fuzz-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Lab 7

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install hypothesis pytest

      - name: SS1 - Run original buggy application
        continue-on-error: true
        run: |
          printf "2-30-MAYBE\n45/3\nCALM\n" | python processor_buggy.py

      - name: SS2 - Run fuzz tests against buggy implementation
        continue-on-error: true
        run: |
          cp processor.py processor_fixed_backup.py
          cp processor_buggy.py processor.py
          python -m pytest -v test_processor.py

      - name: Restore fixed application
        if: always()
        run: |
          if [ -f processor_fixed_backup.py ]; then
            cp processor_fixed_backup.py processor.py
          fi

      - name: SS3 - Run fixed application
        run: |
          printf "2-30-YES\n45/3\nCALM\n" | python processor.py

      - name: SS4 - Run Hypothesis tests against fixed implementation
        run: python -m pytest -v test_processor.py
        
